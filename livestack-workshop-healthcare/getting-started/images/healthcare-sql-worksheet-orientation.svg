<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">SQL Worksheet orientation for the healthcare workshop</title>
  <desc id="desc">Annotated SQL Worksheet showing LLUSER, the SQL editor, Run Statement, and the Query Result panel.</desc>
  <rect width="1100" height="720" fill="#f5f3ef"/>
  <rect x="35" y="35" width="1030" height="650" rx="16" fill="#fff" stroke="#c9c5c0" stroke-width="2"/>
  <rect x="35" y="35" width="1030" height="62" rx="16" fill="#2f2b29"/>
  <rect x="35" y="81" width="1030" height="16" fill="#2f2b29"/>
  <text x="65" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Oracle Database Actions — SQL Worksheet</text>

  <rect x="55" y="120" width="205" height="520" fill="#f8f8f8" stroke="#dedbd7"/>
  <text x="75" y="156" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2f2b29">Navigator</text>
  <text x="75" y="198" font-family="Arial, sans-serif" font-size="16" fill="#4b4744">Tables</text>
  <text x="90" y="230" font-family="Arial, sans-serif" font-size="15" fill="#4b4744">HC_CARE_SERVICES</text>
  <text x="90" y="260" font-family="Arial, sans-serif" font-size="15" fill="#4b4744">HC_QUALITY_SIGNALS</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="15" fill="#4b4744">HC_SERVICE_REQUESTS</text>

  <rect x="285" y="120" width="760" height="300" fill="#fff" stroke="#dedbd7"/>
  <rect x="285" y="120" width="760" height="48" fill="#f3f3f3"/>
  <rect x="305" y="130" width="110" height="29" rx="8" fill="#fff" stroke="#b8b3ad"/>
  <text x="326" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f2b29">LLUSER</text>
  <rect x="895" y="130" width="126" height="29" rx="8" fill="#c74634"/>
  <text x="913" y="151" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Run Statement</text>
  <g font-family="Menlo, monospace" font-size="18">
    <text x="325" y="220" fill="#1b5e9a">SELECT</text>
    <text x="405" y="220" fill="#2f2b29"> USER </text>
    <text x="470" y="220" fill="#1b5e9a">AS</text>
    <text x="505" y="220" fill="#a33"> "User",</text>
    <text x="325" y="260" fill="#2f2b29">       SYS_CONTEXT(</text>
    <text x="540" y="260" fill="#a33">'USERENV'</text>
    <text x="650" y="260" fill="#2f2b29">, </text>
    <text x="675" y="260" fill="#a33">'CURRENT_SCHEMA'</text>
    <text x="855" y="260" fill="#2f2b29">)</text>
    <text x="325" y="300" fill="#1b5e9a">AS</text>
    <text x="360" y="300" fill="#a33"> "Schema"</text>
    <text x="455" y="300" fill="#2f2b29">;</text>
  </g>

  <rect x="285" y="445" width="760" height="195" fill="#fff" stroke="#dedbd7"/>
  <rect x="285" y="445" width="760" height="44" fill="#f3f3f3"/>
  <text x="305" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2f2b29">Query Result</text>
  <line x1="305" y1="505" x2="1015" y2="505" stroke="#c9c5c0"/>
  <text x="335" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f2b29">User</text>
  <text x="560" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f2b29">Schema</text>
  <text x="335" y="590" font-family="Arial, sans-serif" font-size="18" fill="#3f7d68">LLUSER</text>
  <text x="560" y="590" font-family="Arial, sans-serif" font-size="18" fill="#3f7d68">LLUSER</text>

  <g font-family="Arial, sans-serif">
    <rect x="300" y="104" width="180" height="36" rx="18" fill="#fff" stroke="#287c99" stroke-width="2"/>
    <text x="320" y="128" font-size="15" font-weight="700" fill="#205f74">1. Confirm LLUSER</text>
    <rect x="835" y="92" width="210" height="36" rx="18" fill="#fff" stroke="#c74634" stroke-width="2"/>
    <text x="855" y="116" font-size="15" font-weight="700" fill="#9f3528">2. Run the statement</text>
    <rect x="770" y="620" width="260" height="36" rx="18" fill="#fff" stroke="#3f7d68" stroke-width="2"/>
    <text x="790" y="644" font-size="15" font-weight="700" fill="#2e6856">3. Read the result table</text>
  </g>
</svg>
