<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720" role="img" aria-labelledby="title desc">
  <title id="title">Audience signal search as vector evidence</title>
  <desc id="desc">Audience questions become vector comparisons, media evidence, and a review path inside SQL.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#dfe5e9" flood-opacity="1"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L13,8 L2,14 Z" fill="#587083"/>
    </marker>
  </defs>

  <rect width="1920" height="720" fill="#f5f7f9"/>
  <rect x="32" y="24" width="1856" height="656" rx="24" fill="#ffffff"/>

  <text x="88" y="86" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1f2933">Audience signal search as vector evidence</text>
  <text x="88" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52616d">Vector search compares meaning, not just exact keywords, while keeping matches inside SQL.</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <g filter="url(#shadow)">
      <rect x="116" y="220" width="336" height="280" rx="18" fill="#fbf6ed" stroke="#d9be87" stroke-width="1.5"/>
      <rect x="110" y="220" width="12" height="280" rx="6" fill="#e64b3c"/>
      <text x="152" y="274" font-size="24" font-weight="700">Audience question</text>
      <text x="152" y="320" font-size="21">Brand Safety Risk</text>
      <text x="152" y="360" font-size="21">Subscriber Churn</text>
      <text x="152" y="400" font-size="21">Launch Demand</text>
      <text x="152" y="440" font-size="21">Creator Momentum</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="562" y="220" width="392" height="280" rx="18" fill="#edf8f5" stroke="#8ccbbd" stroke-width="1.5"/>
      <rect x="550" y="220" width="12" height="280" rx="6" fill="#2f8374"/>
      <text x="592" y="274" font-size="24" font-weight="700">Vector comparison</text>
      <text x="592" y="320" font-size="21">VECTOR_EMBEDDING</text>
      <text x="592" y="360" font-size="21">VECTOR_DISTANCE</text>
      <text x="592" y="400" font-size="21">Similarity score</text>
      <text x="592" y="440" font-size="21">Ranked matches</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1072" y="220" width="320" height="280" rx="18" fill="#eef5fa" stroke="#a9c4d8" stroke-width="1.5"/>
      <rect x="1060" y="220" width="12" height="280" rx="6" fill="#18556b"/>
      <text x="1102" y="274" font-size="24" font-weight="700">Media evidence</text>
      <text x="1102" y="320" font-size="21">Content assets</text>
      <text x="1102" y="360" font-size="21">Audience signals</text>
      <text x="1102" y="400" font-size="21">Post mentions</text>
      <text x="1102" y="440" font-size="21">Signal notes</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1512" y="220" width="300" height="280" rx="18" fill="#fbf1f4" stroke="#e1b3c0" stroke-width="1.5"/>
      <rect x="1500" y="220" width="12" height="280" rx="6" fill="#e64b3c"/>
      <text x="1542" y="274" font-size="24" font-weight="700">Review path</text>
      <text x="1542" y="320" font-size="21">Best matches</text>
      <text x="1542" y="360" font-size="21">Why relevant</text>
      <text x="1542" y="400" font-size="21">Next action</text>
    </g>
  </g>

  <g stroke="#587083" stroke-width="6" marker-end="url(#arrow)">
    <line x1="468" y1="360" x2="528" y2="360"/>
    <line x1="974" y1="360" x2="1038" y2="360"/>
    <line x1="1418" y1="360" x2="1478" y2="360"/>
  </g>

  <text x="86" y="652" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52616d">Higher similarity scores help reviewers focus on the signals that are closest in meaning to the business question.</text>
  <rect x="32" y="682" width="1856" height="14" rx="7" fill="#e9eef2"/>
</svg>
