<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Spatial point distance for network field planning</title>
  <desc id="desc">A three-step Telco spatial diagram displays network-site points, calculates SDO_GEOM.SDO_DISTANCE, and returns a reviewable field-planning comparison.</desc>
  <style>.title{font:700 24px Arial,sans-serif;fill:#161513}.sub{font:15px Arial,sans-serif;fill:#4f4f4f}.head{font:700 18px Arial,sans-serif;fill:#fff}.item{font:15px Arial,sans-serif;fill:#292522}.foot{font:600 15px Arial,sans-serif;fill:#4f4f4f}</style>
  <rect width="900" height="360" fill="#f7f8f9"/>
  <text x="42" y="42" class="title">Compare network-site points before assigning field work</text>
  <text x="42" y="67" class="sub">Lab 6 keeps stored locations, distance evidence, capacity context, and the field decision in one governed database.</text>
  <rect x="42" y="96" width="240" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="42" y="96" width="240" height="42" rx="12" fill="#4f8397"/><rect x="42" y="126" width="240" height="12" fill="#4f8397"/>
  <text x="62" y="123" class="head">Stored locations</text><text x="63" y="168" class="item">NETWORK_SITES</text><text x="63" y="196" class="item">SDO_GEOMETRY point</text><text x="63" y="224" class="item">SRID 4326</text><text x="63" y="252" class="item">longitude + latitude</text>
  <path d="M294 193h40v-13l24 13-24 13v-13h-40z" fill="#c74634"/>
  <rect x="372" y="96" width="240" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="372" y="96" width="240" height="42" rx="12" fill="#397e97"/><rect x="372" y="126" width="240" height="12" fill="#397e97"/>
  <text x="392" y="123" class="head">Distance SQL</text><text x="393" y="168" class="item">WKT point display</text><text x="393" y="196" class="item">SDO_DISTANCE</text><text x="393" y="224" class="item">unit=MILE</text><text x="393" y="252" class="item">nearest pairs first</text>
  <path d="M624 193h40v-13l24 13-24 13v-13h-40z" fill="#c74634"/>
  <rect x="678" y="96" width="180" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="678" y="96" width="180" height="42" rx="12" fill="#557a68"/><rect x="678" y="126" width="180" height="12" fill="#557a68"/>
  <text x="698" y="123" class="head">Field review</text><text x="699" y="168" class="item">nearby sites</text><text x="699" y="196" class="item">point values</text><text x="699" y="224" class="item">distance miles</text><text x="699" y="252" class="item">capacity context</text>
  <text x="42" y="332" class="foot">Spatial calculations remain joinable to the operational records that explain a field-response choice.</text>
</svg>
