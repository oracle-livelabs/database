<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">From network pressure to a trusted field response</title>
  <desc id="desc">A four-step Telco workshop journey: observe network pressure, retrieve service-order evidence, connect signals, relationships, and location, then decide a field response on Oracle AI Database 26ai.</desc>
  <style>.title{font:700 30px Arial,sans-serif;fill:#161513}.subtitle{font:17px Arial,sans-serif;fill:#4f4f4f}.step{font:700 13px Arial,sans-serif;letter-spacing:1.3px}.h{font:700 22px Arial,sans-serif;fill:#20201e}.body{font:15px Arial,sans-serif;fill:#4f4f4f}.label{font:700 12px Arial,sans-serif;fill:#6b6660;letter-spacing:.6px}.pill{font:700 11px Arial,sans-serif}.foundation{font:700 23px Arial,sans-serif;fill:#fff}.foundationSub{font:16px Arial,sans-serif;fill:#f3f1ed}.bottom{font:600 17px Arial,sans-serif;fill:#4f4f4f}</style>
  <rect width="1280" height="720" fill="#f7f8f9"/>
  <text x="58" y="70" class="title">From Network Pressure to Trusted Field Response</text><text x="58" y="101" class="subtitle">Connect Telco operations, service orders, subscriber signals, relationships, and location evidence in Oracle AI Database 26ai.</text>
  <g transform="translate(58 150)"><rect width="264" height="344" rx="16" fill="#fff" stroke="#dfdcd8"/><text x="26" y="49" class="step" fill="#c74634">STEP 1</text><text x="26" y="82" class="h">Observe</text><text x="26" y="109" class="h">Network Pressure</text><text x="26" y="145" class="body">Start with capacity load,</text><text x="26" y="167" class="body">subscriber urgency, and</text><text x="26" y="189" class="body">the site that needs review.</text><text x="26" y="226" class="label">RELATED LABS</text><rect x="26" y="242" width="177" height="28" rx="14" fill="#f8e6e1"/><text x="42" y="261" class="pill" fill="#a53527">Lab 1: Foundation</text><rect x="26" y="280" width="177" height="28" rx="14" fill="#f8e6e1"/><text x="42" y="299" class="pill" fill="#a53527">Lab 2: Operations</text></g>
  <path d="M328 322h18v-10l18 10-18 10v-10h-18z" fill="#c74634"/>
  <g transform="translate(358 150)"><rect width="264" height="344" rx="16" fill="#fff" stroke="#dfdcd8"/><text x="26" y="49" class="step" fill="#d9793a">STEP 2</text><text x="26" y="82" class="h">Retrieve</text><text x="26" y="109" class="h">Order Evidence</text><text x="26" y="145" class="body">Read one service order as</text><text x="26" y="167" class="body">application JSON and as</text><text x="26" y="189" class="body">governed relational rows.</text><text x="26" y="226" class="label">RELATED LAB</text><rect x="26" y="242" width="180" height="28" rx="14" fill="#f8eee5"/><text x="42" y="261" class="pill" fill="#a95828">Lab 3: JSON Duality</text></g>
  <path d="M628 322h18v-10l18 10-18 10v-10h-18z" fill="#c74634"/>
  <g transform="translate(658 150)"><rect width="264" height="344" rx="16" fill="#fff" stroke="#dfdcd8"/><text x="26" y="49" class="step" fill="#397e97">STEP 3</text><text x="26" y="82" class="h">Connect</text><text x="26" y="109" class="h">Impact Evidence</text><text x="26" y="145" class="body">Find related signal meaning,</text><text x="26" y="167" class="body">then follow case links and</text><text x="26" y="189" class="body">network-site distance.</text><text x="26" y="226" class="label">RELATED LABS</text><rect x="26" y="242" width="166" height="28" rx="14" fill="#e8eff8"/><text x="42" y="261" class="pill" fill="#24647d">Lab 4: Vector Search</text><rect x="26" y="280" width="192" height="28" rx="14" fill="#e8eff8"/><text x="42" y="299" class="pill" fill="#24647d">Labs 5–6: Graph + Spatial</text></g>
  <path d="M928 322h18v-10l18 10-18 10v-10h-18z" fill="#c74634"/>
  <g transform="translate(958 150)"><rect width="264" height="344" rx="16" fill="#fff" stroke="#dfdcd8"/><text x="26" y="49" class="step" fill="#557a68">STEP 4</text><text x="26" y="82" class="h">Decide</text><text x="26" y="109" class="h">Field Response</text><text x="26" y="145" class="body">Use the connected evidence</text><text x="26" y="167" class="body">to assign capacity and</text><text x="26" y="189" class="body">explain why it matters.</text><text x="26" y="226" class="label">LEARNER OUTCOME</text><rect x="26" y="242" width="191" height="28" rx="14" fill="#eaf1e9"/><text x="42" y="261" class="pill" fill="#356c51">Trusted field action</text></g>
  <rect x="58" y="543" width="1164" height="132" rx="20" fill="#292522"/><text x="640" y="585" class="foundation" text-anchor="middle">Oracle AI Database 26ai Converged Foundation</text><text x="640" y="613" class="foundationSub" text-anchor="middle">SQL rows, JSON documents, vectors, graph relationships, and spatial points stay connected under one governance model.</text><text x="640" y="652" class="bottom" text-anchor="middle"><tspan fill="#c74634">Oracle Converged Database:</tspan> connected Telco evidence, clearer decisions, faster response.</text>
</svg>
