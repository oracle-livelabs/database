<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Operations KPI to Telco field-response evidence</title><desc id="desc">A three-step diagram connects capacity pressure to SQL rows and a field-response decision.</desc>
  <style>.title{font:700 24px Arial,sans-serif;fill:#161513}.sub{font:15px Arial,sans-serif;fill:#4f4f4f}.head{font:700 18px Arial,sans-serif;fill:#fff}.item{font:15px Arial,sans-serif;fill:#292522}.foot{font:600 15px Arial,sans-serif;fill:#4f4f4f}</style>
  <rect width="900" height="360" fill="#f7f8f9"/><text x="42" y="42" class="title">Turn network pressure into a reviewable field response</text><text x="42" y="67" class="sub">Lab 2 links capacity load, subscriber urgency, and named sites through direct SQL.</text>
  <rect x="42" y="96" width="236" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="42" y="96" width="236" height="42" rx="12" fill="#c74634"/><rect x="42" y="126" width="236" height="12" fill="#c74634"/><text x="62" y="123" class="head">Operations pressure</text>
  <text x="63" y="168" class="item">• 91% Hudson Yards load</text><text x="63" y="196" class="item">• 96 urgency signal score</text><text x="63" y="224" class="item">• 420 capacity units free</text><text x="63" y="252" class="item">• 5G service at risk</text>
  <path d="M293 193h55v-13l24 13-24 13v-13h-55z" fill="#c74634"/>
  <rect x="385" y="96" width="236" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="385" y="96" width="236" height="42" rx="12" fill="#397e97"/><rect x="385" y="126" width="236" height="12" fill="#397e97"/><text x="405" y="123" class="head">SQL drill-through</text>
  <text x="406" y="168" class="item">NETWORK_SITES</text><text x="406" y="196" class="item">NETWORK_CAPACITY</text><text x="406" y="224" class="item">SUBSCRIBER_SIGNALS</text><text x="406" y="252" class="item">COUNT + AVG + filters</text>
  <path d="M636 193h55v-13l24 13-24 13v-13h-55z" fill="#c74634"/>
  <rect x="704" y="96" width="154" height="194" rx="12" fill="#fff" stroke="#d6d3cf"/><rect x="704" y="96" width="154" height="42" rx="12" fill="#557a68"/><rect x="704" y="126" width="154" height="12" fill="#557a68"/><text x="724" y="123" class="head">Decision</text>
  <text x="724" y="168" class="item">Prioritize</text><text x="724" y="192" class="item">site review</text><text x="724" y="226" class="item">Assign</text><text x="724" y="250" class="item">field capacity</text>
  <text x="42" y="332" class="foot">Every dashboard number maps to repeatable database rows, not a hidden calculation.</text>
</svg>
