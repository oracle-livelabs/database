name: Publish Agent Factory workshops

on:
  push:
    branches: [main]
    paths:
      - agent-factory/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage workshops
        run: |
          mkdir -p _site
          cp -R agent-factory _site/
          test -f _site/agent-factory/workshops/aiw2026/index.html
          test -f _site/agent-factory/workshops/aiw26-bootcamp/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
