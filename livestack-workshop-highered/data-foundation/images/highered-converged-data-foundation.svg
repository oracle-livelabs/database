<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="666" viewBox="0 0 1280 666" role="img" aria-labelledby="title desc">
  <title id="title">Student-success data becomes one governed Oracle AI Database foundation</title>
  <desc id="desc">A before and after architecture diagram for Seer Higher Education.</desc>
  <rect width="1280" height="666" fill="#f7f8f9"/>
  <text x="64" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2933">From fragmented student-success signals to connected evidence</text>
  <text x="64" y="100" font-family="Arial, sans-serif" font-size="18" fill="#52616b">Seer Higher Education keeps operational, AI, relationship, location, and prediction evidence governed together.</text>
  <rect x="64" y="142" width="470" height="388" rx="18" fill="#ffffff" stroke="#d7dde2" stroke-width="2"/>
  <text x="96" y="188" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3e4a54">Before: separate tools and handoffs</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#25313a">
    <rect x="96" y="222" width="178" height="72" rx="10" fill="#fce8e6"/><text x="116" y="252">Student records</text><text x="116" y="276">and requests</text>
    <rect x="304" y="222" width="178" height="72" rx="10" fill="#fff4ce"/><text x="324" y="252">Service catalog</text><text x="324" y="276">and capacity</text>
    <rect x="96" y="322" width="178" height="72" rx="10" fill="#e6f2fb"/><text x="116" y="352">Signals and</text><text x="116" y="376">semantic search</text>
    <rect x="304" y="322" width="178" height="72" rx="10" fill="#eee9f8"/><text x="324" y="352">Relationships</text><text x="324" y="376">and outreach</text>
    <rect x="96" y="422" width="178" height="72" rx="10" fill="#e6f5ea"/><text x="116" y="452">Campus location</text><text x="116" y="476">and coverage</text>
    <rect x="304" y="422" width="178" height="72" rx="10" fill="#e9eef2"/><text x="324" y="452">Forecasts and</text><text x="324" y="476">model scores</text>
  </g>
  <path d="M556 330 L694 330" stroke="#c74634" stroke-width="10" fill="none"/>
  <path d="M682 312 L716 330 L682 348" fill="none" stroke="#c74634" stroke-width="10"/>
  <text x="572" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#a33628">copy and reconcile</text>
  <rect x="746" y="142" width="470" height="388" rx="18" fill="#ffffff" stroke="#b9d4c6" stroke-width="2"/>
  <text x="778" y="188" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#155c3f">After: Oracle AI Database 26ai</text>
  <rect x="786" y="224" width="390" height="196" rx="14" fill="#e8f4ee" stroke="#78ae91" stroke-width="2"/>
  <text x="816" y="268" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#174d36">One governed student-success core</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#25313a">
    <text x="816" y="310">Relational students, services, and requests</text>
    <text x="816" y="340">JSON documents and AI Vector Search</text>
    <text x="816" y="370">Property Graph, Spatial, and OML scores</text>
  </g>
  <rect x="786" y="446" width="390" height="48" rx="10" fill="#21343f"/>
  <text x="814" y="477" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What changes for Seer Higher Education</text>
  <rect x="64" y="566" width="1152" height="56" rx="12" fill="#21343f"/>
  <text x="94" y="601" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">Business outcome: advisors and planners can trace a student-success signal to governed, reviewable evidence before acting.</text>
</svg>
