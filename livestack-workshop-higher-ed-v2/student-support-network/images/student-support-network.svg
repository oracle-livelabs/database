<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">Student-support relationship graph</title><desc id="d">Synthetic student, course, advisor, and support-service entities connected by labeled relationships.</desc><rect width="1000" height="340" rx="20" fill="#f7f9fb"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">Explore the operational support network</text><g stroke="#758595" stroke-width="3" fill="none"><path d="M205 150L415 120"/><path d="M205 174L415 230"/><path d="M540 120L750 150"/><path d="M540 230L750 174"/></g><g font-family="Arial" text-anchor="middle"><rect x="70" y="120" width="135" height="76" rx="18" fill="#dcebf4" stroke="#728391"/><text x="137" y="151" font-size="17" font-weight="700">Student</text><text x="137" y="175" font-size="14">STU-1001</text><rect x="415" y="82" width="145" height="76" rx="18" fill="#eee8f4" stroke="#728391"/><text x="487" y="113" font-size="17" font-weight="700">Course section</text><text x="487" y="137" font-size="14">shared class</text><rect x="415" y="194" width="145" height="76" rx="18" fill="#f7efd9" stroke="#728391"/><text x="487" y="225" font-size="17" font-weight="700">Advisor</text><text x="487" y="249" font-size="14">program team</text><rect x="750" y="120" width="175" height="76" rx="18" fill="#e4efdf" stroke="#728391"/><text x="837" y="151" font-size="17" font-weight="700">Support service</text><text x="837" y="175" font-size="14">peer tutoring</text></g><g font-family="Arial" font-size="13" fill="#4b5964"><text x="302" y="126">enrolled in</text><text x="302" y="222">assigned to</text><text x="637" y="126">connects peers</text><text x="637" y="224">referral option</text></g><text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="14" fill="#43515c">A connection supports service planning; it is not a judgment about a student.</text></svg>