<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Student-support vector search</title><desc id="d">An embedding model converts a question to a vector. Vector distance ranks resources, and SQL adds linked requests.</desc><rect width="1000" height="300" rx="20" fill="#f7f9fb"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">Find resources by meaning</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="90" width="210" height="100" rx="15" fill="#f8eadf"/><text x="140" y="128" font-size="18" font-weight="700">Support question</text><text x="140" y="157" font-size="14">plain-language text</text><rect x="290" y="90" width="210" height="100" rx="15" fill="#e5eaf5"/><text x="395" y="128" font-size="18" font-weight="700">Embedding model</text><text x="395" y="157" font-size="14">text → vector</text><rect x="545" y="90" width="210" height="100" rx="15" fill="#e4f0e4"/><text x="650" y="128" font-size="18" font-weight="700">Vector ranking</text><text x="650" y="157" font-size="14">closest meanings first</text><rect x="800" y="90" width="165" height="100" rx="15" fill="#ece5f2"/><text x="882" y="128" font-size="18" font-weight="700">SQL result</text><text x="882" y="157" font-size="14">request + resource</text></g><g stroke="#657785" stroke-width="3" fill="none"><path d="M246 140h40"/><path d="m279 133 9 7-9 7"/><path d="M501 140h40"/><path d="m534 133 9 7-9 7"/><path d="M756 140h39"/><path d="m788 133 9 7-9 7"/></g><text x="500" y="245" text-anchor="middle" font-family="Arial" font-size="15" fill="#43515c">Similarity ranks candidates; staff review the result before taking action.</text></svg>
