<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">Select AI review flow</title><desc id="d">An operations question is translated to SQL, inspected, executed, and compared with a database result.</desc><rect width="1000" height="280" rx="20" fill="#f7f9fb"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">Ask, inspect, run, and compare</text><g font-family="Arial" text-anchor="middle"><rect x="38" y="95" width="205" height="112" rx="15" fill="#e6eff6"/><text x="140" y="135" font-size="18" font-weight="700">Question</text><text x="140" y="164" font-size="14">operations language</text><rect x="282" y="95" width="205" height="112" rx="15" fill="#eee8f4"/><text x="384" y="135" font-size="18" font-weight="700">SHOWSQL</text><text x="384" y="164" font-size="14">review the statement</text><rect x="526" y="95" width="205" height="112" rx="15" fill="#e5f0e3"/><text x="628" y="135" font-size="18" font-weight="700">RUNSQL</text><text x="628" y="164" font-size="14">inspect database rows</text><rect x="770" y="95" width="190" height="112" rx="15" fill="#f7efda"/><text x="865" y="135" font-size="18" font-weight="700">Compare</text><text x="865" y="164" font-size="14">check the answer</text></g><g stroke="#657785" stroke-width="3" fill="none"><path d="M244 151h32"/><path d="m268 144 9 7-9 7"/><path d="M488 151h32"/><path d="m512 144 9 7-9 7"/><path d="M732 151h32"/><path d="m756 144 9 7-9 7"/></g><text x="500" y="245" text-anchor="middle" font-family="Arial" font-size="15" fill="#43515c">The profile limits approved views; database privileges still apply.</text></svg>
