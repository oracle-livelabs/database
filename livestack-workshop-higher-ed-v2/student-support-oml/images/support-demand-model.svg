<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Student-support demand model</title><desc id="d">Aggregated program and campus features are used to train a model and score a separate next-term snapshot.</desc><rect width="1000" height="300" rx="20" fill="#f7f9fb"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">Forecast service workload by cohort</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="93" width="235" height="112" rx="15" fill="#e6eff6"/><text x="162" y="131" font-size="16" font-weight="700">Synthetic training examples</text><text x="162" y="159" font-size="14">program + campus totals</text><text x="162" y="181" font-size="14">generated SURGE / STABLE label</text><rect x="383" y="93" width="235" height="112" rx="15" fill="#eee8f4"/><text x="500" y="131" font-size="18" font-weight="700">OML classifier</text><text x="500" y="159" font-size="14">train inside the database</text><text x="500" y="181" font-size="14">compare with AutoML</text><rect x="720" y="93" width="235" height="112" rx="15" fill="#e4efdf"/><text x="837" y="131" font-size="16" font-weight="700">Illustrative next-term inputs</text><text x="837" y="159" font-size="14">predicted workload label</text><text x="837" y="181" font-size="14">and probability for review</text></g><g stroke="#657785" stroke-width="3" fill="none"><path d="M281 149h95"/><path d="m367 142 9 7-9 7"/><path d="M619 149h95"/><path d="m705 142 9 7-9 7"/></g><text x="500" y="254" text-anchor="middle" font-family="Arial" font-size="15" fill="#43515c">Synthetic data demonstrates scoring; it does not validate future demand.</text></svg>
