<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">JSON patterns for student-support requests</title><desc id="d">A JSON column, collection table, and duality view serve different application needs over Oracle Database.</desc><rect width="1000" height="280" rx="20" fill="#f7f9fb"/><text x="35" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">Choose the JSON interface that fits the feature</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="90" width="270" height="130" rx="16" fill="#e6eff6"/><text x="180" y="128" font-size="20" font-weight="700">JSON column</text><text x="180" y="160" font-size="15">optional app settings</text><text x="180" y="186" font-size="14">beside relational keys</text><rect x="365" y="90" width="270" height="130" rx="16" fill="#efe8f4"/><text x="500" y="128" font-size="20" font-weight="700">JSON collection</text><text x="500" y="160" font-size="15">documents owned by the app</text><text x="500" y="186" font-size="14">one JSON DATA value per row</text><rect x="685" y="90" width="270" height="130" rx="16" fill="#e7f0e5"/><text x="820" y="128" font-size="20" font-weight="700">Duality view</text><text x="820" y="160" font-size="15">JSON over normalized rows</text><text x="820" y="186" font-size="14">SQL and document access</text></g><text x="500" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#43515c">One database keeps application documents connected to relational records and controls.</text></svg>
