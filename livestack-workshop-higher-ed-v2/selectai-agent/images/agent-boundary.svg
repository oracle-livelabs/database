<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="t d"><title id="t">Read-only student-support agent boundary</title><desc id="d">A configured agent calls one approved SQL tool against summary views and produces a logged answer.</desc><rect width="1000" height="310" rx="20" fill="#f7f9fb"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="700" fill="#1f2933">One approved path from question to answer</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="100" width="185" height="105" rx="15" fill="#e6eff6"/><text x="127" y="140" font-size="18" font-weight="700">Nina's question</text><text x="127" y="168" font-size="14">aggregate planning</text><rect x="282" y="100" width="185" height="105" rx="15" fill="#eee8f4"/><text x="374" y="140" font-size="18" font-weight="700">Configured agent</text><text x="374" y="168" font-size="14">role + task</text><rect x="529" y="100" width="205" height="105" rx="15" fill="#e5f0e3"/><text x="631" y="140" font-size="18" font-weight="700">SQL tool</text><text x="631" y="168" font-size="14">approved views only</text><rect x="796" y="100" width="170" height="105" rx="15" fill="#f7efda"/><text x="881" y="140" font-size="18" font-weight="700">Answer + history</text><text x="881" y="168" font-size="14">reviewable run</text></g><g stroke="#657785" stroke-width="3" fill="none"><path d="M221 152h55"/><path d="m267 145 9 7-9 7"/><path d="M468 152h54"/><path d="m513 145 9 7-9 7"/><path d="M735 152h54"/><path d="m780 145 9 7-9 7"/></g><rect x="285" y="236" width="430" height="43" rx="12" fill="#fff" stroke="#9aa7b2"/><text x="500" y="264" text-anchor="middle" font-family="Arial" font-size="15" fill="#43515c">Read-only boundary: no tool to change records or decide individual outcomes</text></svg>
