<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="SF Mono,Menlo,Consolas,monospace">
  <title>Real mongosh transcript: updateMany reports matchedCount 5 but modifiedCount 4 - one store silently missed because its price was stored as a string</title>
  <style>
    .term  { fill:#1e1e1e; }
    .bar   { fill:#3a3a3a; }
    .barT  { fill:#d8d8d8; font-size:12px; }
    .cmd   { fill:#8ed08e; font-size:13px; }
    .out   { fill:#e6e6e6; font-size:13px; }
    .key   { fill:#9cc7ff; font-size:13px; }
    .hit   { fill:#ffd479; font-size:13px; font-weight:bold; }
    .miss  { fill:#ff8a7a; font-size:13px; font-weight:bold; }
    .note  { fill:#312d2a; font-size:13px; }
    .noteB { font-weight:bold; }
    .cap   { fill:#6b6560; font-size:11.5px; font-style:italic; }
  </style>

  <rect class="term" x="20" y="20" width="920" height="268" rx="8"/>
  <rect class="bar"  x="20" y="20" width="920" height="26" rx="8"/>
  <rect class="bar"  x="20" y="38" width="920" height="10"/>
  <text class="barT" x="36" y="38">mongosh — ADMIN@ATP219273</text>

  <text class="cmd" x="36" y="76">ADMIN&gt; db.stores.updateMany(</text>
  <text class="cmd" x="106" y="96">{},</text>
  <text class="cmd" x="106" y="116">{ $set: { "menus.$[].categories.$[].items.$[i].price": 1399 } },</text>
  <text class="cmd" x="106" y="136">{ arrayFilters: [ { "i.item_id": 1000 } ] }</text>
  <text class="cmd" x="90" y="156">)</text>

  <text class="out" x="36" y="186">{</text>
  <text class="key" x="52" y="206">acknowledged: <tspan class="out">true,</tspan></text>
  <text class="key" x="52" y="226">matchedCount: <tspan class="hit">5,</tspan></text>
  <text class="key" x="52" y="246">modifiedCount: <tspan class="miss">4,</tspan></text>
  <text class="key" x="52" y="266">upsertedCount: <tspan class="out">0</tspan> <tspan class="out">}</tspan></text>

  <text class="note" x="20" y="320"><tspan class="noteB">Five stores matched. Four were changed.</tspan> The driver reported success and no error was raised.</text>
  <text class="note" x="20" y="342">Store s_104 holds its price as the string <tspan font-family="SF Mono,Menlo,Consolas,monospace">"1000"</tspan>, so the array filter never selected it — and nothing in this</text>
  <text class="note" x="20" y="364">response tells you which store was skipped, or that a skip mattered. You have to already know to compare the two counts.</text>

  <text class="cap" x="20" y="398">Real transcript captured on a LiveLabs sandbox (ATP219273, ap-seoul-1), typeset for legibility.</text>
</svg>
