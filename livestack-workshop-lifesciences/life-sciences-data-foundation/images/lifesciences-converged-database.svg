<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="748" viewBox="0 0 1440 748" role="img" aria-labelledby="title desc">
  <title id="title">Before and after data architecture for Seer Lifesciences</title>
  <desc id="desc">Fragmented specialist stores converge into Oracle AI Database 26ai for connected life sciences evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="128%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1440" height="748" fill="#f8fafc"/>
  <text x="720" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827" text-anchor="middle">One governed foundation for clinical supply intelligence</text>
  <text x="720" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Seer Lifesciences keeps product, quality, order, location, graph, vector, and model evidence connected.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="138" width="548" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="138" width="548" height="62" rx="18" fill="#fee2e2"/>
    <text x="344" y="178" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Before: fractured stores</text>
  </g>
<rect x="118" y="242" width="202" height="58" rx="12" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="219" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="219" dy="0">Product master</tspan></text>
<rect x="368" y="242" width="202" height="58" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="469" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="469" dy="0">Quality signals</tspan></text>
<rect x="118" y="326" width="202" height="58" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="219" y="362" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="219" dy="0">Order documents</tspan></text>
<rect x="368" y="326" width="202" height="58" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="469" y="362" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="469" dy="0">Vector index</tspan></text>
<rect x="118" y="410" width="202" height="58" rx="12" fill="#fce7f3" stroke="#cbd5e1"/>
<text x="219" y="446" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="219" dy="0">Network graph</tspan></text>
<rect x="368" y="410" width="202" height="58" rx="12" fill="#ccfbf1" stroke="#cbd5e1"/>
<text x="469" y="446" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle"><tspan x="469" dy="0">Spatial maps</tspan></text>
<text x="344" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="344" dy="0">More copies, more reconciliation,</tspan><tspan x="344" dy="24">and harder audit trails.</tspan></text>
<path d="M650 356 H790" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="824" y="138" width="548" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1"/><rect x="824" y="138" width="548" height="62" rx="18" fill="#dcfce7"/>
<text x="1098" y="178" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">What changes for Seer Lifesciences</text></g>
<rect x="908" y="238" width="380" height="104" rx="18" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="1098" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#3730a3" text-anchor="middle"><tspan x="1098" dy="0">Oracle AI Database 26ai</tspan></text>
<text x="1098" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle"><tspan x="1098" dy="0">SQL, JSON, vectors, graph, spatial, and OML</tspan></text>
<text x="1098" y="394" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle"><tspan x="1098" dy="0">Product and clinical supply facts stay queryable.</tspan><tspan x="1098" dy="34">Quality signal text stays tied to source rows.</tspan><tspan x="1098" dy="34">Graph, spatial, and model outputs stay explainable.</tspan><tspan x="1098" dy="34">Fewer sensitive copies leave the database boundary.</tspan></text>
<rect x="70" y="618" width="1302" height="72" rx="16" fill="#111827"/>
<text x="721" y="661" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="721" dy="0">Business impact: faster investigation, clearer governance, and repeatable SQL evidence for regulated supply decisions.</tspan></text>
</svg>
