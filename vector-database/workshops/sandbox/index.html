    <meta name="description" content="Oracle LiveLabs gives you access to Oracle products so you can run hands-on labs and workshops in a guided environment.">

    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/jquery-1.11.0.min.js"></script>

    <script>
        // Keep the local authoring preview from reusing cached Markdown lab files.
        $.ajaxSetup({ cache: false });
    </script>
    <script>
        // Add reliable Copy buttons without using <copy> tags in Markdown.
        document.addEventListener("DOMContentLoaded", function () {
            const lab = new URLSearchParams(window.location.search).get("lab");
            if (!["03-vector-database-foundations", "04-create-embeddings", "05-exhaustive-semantic-search", "07-create-query-memory-module", "06-approximate-search-indexes"].includes(lab)) return;

            function addCopyButtons() {
                let codeBlocks = document.querySelectorAll("#module-content pre");
                if (lab === "04-create-embeddings" || lab === "03-vector-database-foundations") {
                    const targetTasks = lab === "04-create-embeddings"
                        ? [
                            "Task 1: Explore National Parks data",
                            "Task 2: Load National Parks Records into parks",
                            "Task 3: Create Direction Embeddings and Load the Directions Table"
                        ]
                        : [
                            "Task 1: Confirm Available Embedding Models",
                            "Task 2: Create an Integrated Embedding Table",
                            "Task 3: Create a Bring-Your-Own-Vector Table"
                        ];
                    const taskHeadings = Array.from(document.querySelectorAll("#module-content h2"))
                        .filter(function (heading) {
                            return targetTasks.includes(heading.textContent.trim());
                        });
                    if (!taskHeadings.length) return;
                    const taskBlocks = [];
                    taskHeadings.forEach(function (taskHeading) {
                        let sibling = taskHeading.nextElementSibling;
                        while (sibling && sibling.tagName !== "H2") {
                            if (sibling.tagName === "PRE") taskBlocks.push(sibling);
                            taskBlocks.push.apply(taskBlocks, sibling.querySelectorAll("pre"));
                            sibling = sibling.nextElementSibling;
                        }
                    });
                    codeBlocks = taskBlocks;
                }
                codeBlocks.forEach(function (pre) {
                    if (pre.querySelector(".preview-copy-button")) return;
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "copy-button preview-copy-button";
                    button.textContent = "Copy";
                    button.addEventListener("click", function () {
                        const code = pre.querySelector("code");
                        const text = code ? code.textContent : pre.textContent;
                        navigator.clipboard.writeText(text).then(function () {
                            button.textContent = "Copied";
                            setTimeout(function () { button.textContent = "Copy"; }, 1200);
                        });
                    });
                    pre.insertBefore(button, pre.firstChild);
                });
            }

            new MutationObserver(addCopyButtons).observe(document.getElementById("module-content"), {
                childList: true,
                subtree: true
            });
            addCopyButtons();
        });
    </script>
    <link rel="stylesheet" href="https://livelabs.oracle.com/cdn/common/redwood-hol/css/style.min.css">
    <link rel="shortcut icon" href="https://livelabs.oracle.com/cdn/common/redwood-hol/img/favicon.ico">
</head>
