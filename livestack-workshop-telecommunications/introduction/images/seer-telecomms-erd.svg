<g font-size="15"><text x="391" y="202">1 : many</text><text x="391" y="482">1 : many</text><text x="220" y="355">1 : many</text><text x="805" y="236">1 : many</text><text x="836" y="463">1 : many</text></g>
<text x="40" y="680" font-size="17">Order total = sum of monthly line charges + activation fee. Nearby sites do not establish measured coverage.</text>
