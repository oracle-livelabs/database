<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Gilly runs semantic disruption search</title><desc id="desc">An approved embedding model converts a transportation phrase to a vector and ranks related service and disruption records.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 3 · Find disruption signals by meaning</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="91" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">G</text><text x="64" y="335" class="t">Gilly</text><text x="35" y="361" class="b">AI engineer</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">MEANING INPUT</text><text x="260" y="190" class="t">Operator phrase</text><text x="260" y="220" class="b">ALL_MINILM_L12_V2</text><text x="260" y="250" class="b">VECTOR_EMBEDDING</text><text x="260" y="280" class="b">384 numeric dimensions</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">VECTOR EVIDENCE</text><text x="620" y="190" class="t">PRODUCT_EMBEDDINGS</text><text x="620" y="220" class="t">SIGNAL_EMBEDDINGS</text><text x="620" y="255" class="b">VECTOR_DISTANCE ranks</text><text x="620" y="280" class="b">the closest meanings.</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">SEARCH OUTCOME</text><text x="980" y="190" class="t">Relevant signals first</text><text x="980" y="220" class="b">Match different wording.</text><text x="980" y="250" class="b">Review distance beside</text><text x="980" y="280" class="b">service and post evidence.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Gilly embeds one phrase, compares stored vectors, and checks the ranked operational evidence.</text><text x="265" y="405" class="b">The database performs semantic search without exporting governed text.</text>
</svg>
