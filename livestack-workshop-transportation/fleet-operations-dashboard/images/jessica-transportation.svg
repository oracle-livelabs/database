<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Jessica builds a governed fleet operations view</title><desc id="desc">Jessica connects transportation service, order, signal, and terminal evidence in one ranked operations query.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 1 · Rank the service that needs attention</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="94" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">J</text><text x="53" y="335" class="t">Jessica</text><text x="33" y="361" class="b">Database admin</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">GOVERNED OBJECTS</text><text x="260" y="190" class="t">TRANSPORT_SERVICES_V</text><text x="260" y="220" class="b">ORDERS · SOCIAL_POSTS</text><text x="260" y="250" class="b">LOGISTICS_TERMINALS_V</text><text x="260" y="280" class="b">One LLUSER security model</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">SQL EVIDENCE</text><text x="620" y="190" class="t">Join + aggregate + rank</text><text x="620" y="220" class="b">Freight value and units</text><text x="620" y="250" class="b">Disruption signals</text><text x="620" y="280" class="b">Nearby network capacity</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">OPERATIONS OUTCOME</text><text x="980" y="190" class="t">Fleet risk watchlist</text><text x="980" y="220" class="b">Review the highest-value</text><text x="980" y="250" class="b">service first, with evidence</text><text x="980" y="280" class="b">kept beside the decision.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Jessica inspects catalog objects, runs the dashboard query, and drills into governed detail.</text><text x="265" y="405" class="b">Relational rows remain the source while vector, JSON, spatial, and model features add context.</text>
</svg>
