<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Thomas inspects a shipment JSON Relational Duality View</title><desc id="desc">Relational order tables provide one governed JSON shipment document that an application can read and update.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 2 · Serve shipment JSON without another data copy</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="94" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">T</text><text x="54" y="335" class="t">Thomas</text><text x="24" y="361" class="b">App developer</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">RELATIONAL SOURCE</text><text x="260" y="190" class="t">ORDERS</text><text x="260" y="220" class="t">ORDER_ITEMS</text><text x="260" y="255" class="b">Header and line-item rows</text><text x="260" y="280" class="b">stay governed in place.</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">DOCUMENT VIEW</text><text x="620" y="190" class="t">ORDERS_DV</text><text x="620" y="220" class="b">JSON object + item array</text><text x="620" y="250" class="b">Read through SQL or REST</text><text x="620" y="280" class="b">No synchronization job</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">APPLICATION OUTCOME</text><text x="980" y="190" class="t">One shipment contract</text><text x="980" y="220" class="b">Developers use JSON.</text><text x="980" y="250" class="b">Database teams retain</text><text x="980" y="280" class="b">relational integrity.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Thomas queries a shipment document, traces its fields to rows, and confirms one source of truth.</text><text x="265" y="405" class="b">The duality view bridges application shape and relational control.</text>
</svg>
