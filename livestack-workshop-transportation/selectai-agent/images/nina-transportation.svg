<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Nina runs a governed transportation agent team</title><desc id="desc">A Select AI Agent team routes a bounded task through one approved SQL tool and records team and tool history.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 8 · Orchestrate one approved transportation task</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="90" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">N</text><text x="69" y="335" class="t">Nina</text><text x="21" y="361" class="b">Operations analyst</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">AGENT OBJECTS</text><text x="260" y="190" class="t">NINA_TRANSPORT_TEAM</text><text x="260" y="220" class="b">…_AGENT · …_TASK</text><text x="260" y="250" class="b">…_SQL_TOOL</text><text x="260" y="280" class="b">GENAI profile from Lab 7</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">EXECUTION PATH</text><text x="620" y="190" class="t">RUN_TEAM</text><text x="620" y="220" class="b">Question → task → tool</text><text x="620" y="250" class="b">Read-only SQL result</text><text x="620" y="280" class="b">Team + tool history</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">AGENT OUTCOME</text><text x="980" y="190" class="t">Bounded recommendation</text><text x="980" y="220" class="b">Cites validated rows.</text><text x="980" y="250" class="b">Suggests human review.</text><text x="980" y="280" class="b">Claims no operational change.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Nina creates the tool, agent, task, and team, then verifies both execution histories.</text><text x="265" y="405" class="b">Cleanup removes the temporary agent objects after the governed exercise.</text>
</svg>
