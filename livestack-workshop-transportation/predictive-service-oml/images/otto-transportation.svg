<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Otto evaluates a transportation demand-surge prototype</title><desc id="desc">Oracle Machine Learning trains on earlier service weeks and evaluates predictions on later held-out weeks.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 6 · Evaluate a demand-surge prototype on held-out data</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="89" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">O</text><text x="73" y="335" class="t">Otto</text><text x="30" y="361" class="b">Data scientist</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">TIME-BASED CASES</text><text x="260" y="190" class="t">155 train cases</text><text x="260" y="218" class="t">62 held-out cases</text><text x="260" y="255" class="b">Observation week features</text><text x="260" y="280" class="b">Following week outcome</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">ORACLE OML</text><text x="620" y="190" class="t">DEMAND_SURGE_MODEL</text><text x="620" y="220" class="b">DBMS_DATA_MINING</text><text x="620" y="250" class="b">PREDICTION functions</text><text x="620" y="280" class="b">Persisted in LLUSER</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">HELD-OUT EVIDENCE</text><text x="980" y="190" class="t">Confusion matrix</text><text x="980" y="220" class="b">Precision · recall · F1</text><text x="980" y="250" class="b">Reveal errors before</text><text x="980" y="280" class="b">operational use.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Otto trains on earlier weeks, scores later weeks, and reads class metrics.</text><text x="265" y="405" class="b">The evidence supports a prototype decision, not an automatic capacity action.</text>
</svg>
