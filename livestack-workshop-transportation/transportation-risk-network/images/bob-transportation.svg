<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Bob traces a transportation risk network</title><desc id="desc">A property graph connects transportation entities and relationships so Bob can trace multi-hop exposure from a disruption case.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 4 · Trace connected operational risk</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="92" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">B</text><text x="75" y="335" class="t">Bob</text><text x="27" y="361" class="b">Graph specialist</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">GRAPH OBJECTS</text><text x="260" y="187" class="t">TRANSPORT_ENTITIES</text><text x="260" y="216" class="b" font-weight="700">TRANSPORT_RELATIONSHIPS</text><text x="260" y="250" class="b">Hubs · lanes · yards</text><text x="260" y="277" class="b">Cases · dependency edges</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">SQL/PGQ EVIDENCE</text><text x="620" y="187" class="t">TRANSPORT_SIGNAL_</text><text x="620" y="214" class="t">NETWORK</text><text x="620" y="244" class="b">MATCH paths from port</text><text x="620" y="270" class="b">One-hop and two-hop</text><text x="620" y="294" class="b">risk + evidence scores</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">RISK OUTCOME</text><text x="980" y="190" class="t">Expose dependencies</text><text x="980" y="220" class="b">See which hubs, lanes,</text><text x="980" y="250" class="b">and yards connect to</text><text x="980" y="280" class="b">the disruption case.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Bob starts with PORT-LAX-DRAY, traverses relationships, and ranks exposed assets.</text><text x="265" y="405" class="b">The query preserves each path as explainable operational evidence.</text>
</svg>
