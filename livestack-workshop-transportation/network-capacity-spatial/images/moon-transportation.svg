<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Moon compares terminal proximity and capacity</title><desc id="desc">Oracle Spatial measures terminal distance from a demand region and adds processing capacity for rerouting review.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#201515}.k{font:700 16px Arial;fill:#8f1d14}.t{font:700 20px Arial;fill:#201515}.b{font:16px Arial;fill:#4a3b37}.c{fill:#fff;stroke:#d9cbc4;stroke-width:2}.a{fill:none;stroke:#c74634;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker><clipPath id="p"><circle cx="112" cy="227" r="78"/></clipPath></defs>
  <rect width="1280" height="480" fill="#faf7f5"/><text x="40" y="54" class="h">Lab 5 · Find capacity near a demand region</text>
  <circle cx="112" cy="227" r="84" fill="#f0ded7"/><text x="87" y="247" font-family="Arial" font-size="58" font-weight="700" fill="#8f1d14">M</text><text x="62" y="335" class="t">Moon</text><text x="25" y="361" class="b">Spatial specialist</text>
  <rect x="235" y="120" width="270" height="190" rx="16" class="c"/><text x="260" y="153" class="k">SPATIAL OBJECTS</text><text x="260" y="190" class="t">LOGISTICS_TERMINALS_V</text><text x="260" y="220" class="t">DEMAND_REGIONS</text><text x="260" y="255" class="b">WGS 84 · SRID 4326</text><text x="260" y="280" class="b">Points and polygons</text>
  <path d="M515 215 H585" class="a"/><rect x="595" y="120" width="270" height="190" rx="16" class="c"/><text x="620" y="153" class="k">SPATIAL EVIDENCE</text><text x="620" y="190" class="t">SDO_GEOM.SDO_DISTANCE</text><text x="620" y="220" class="b">Kilometers to boundary</text><text x="620" y="250" class="b">Processing capacity</text><text x="620" y="280" class="b">Current utilization</text>
  <path d="M875 215 H945" class="a"/><rect x="955" y="120" width="285" height="190" rx="16" class="c"/><text x="980" y="153" class="k">NETWORK OUTCOME</text><text x="980" y="190" class="t">Capacity-aware options</text><text x="980" y="220" class="b">Proximity starts the review.</text><text x="980" y="250" class="b">Capacity and utilization</text><text x="980" y="280" class="b">make it operational.</text>
  <rect x="235" y="350" width="1005" height="72" rx="14" fill="#f3e5df"/><text x="265" y="380" class="k">PERSONA ACTION</text><text x="430" y="380" class="b">Moon ranks terminals near the Northeast Corridor, then checks available processing capacity.</text><text x="265" y="405" class="b">Distance informs the choice but does not authorize a reroute.</text>
</svg>
