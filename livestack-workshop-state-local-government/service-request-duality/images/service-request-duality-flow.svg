<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Service request JSON Relational Duality flow</title><desc id="d">Orders and order items remain relational while ORDERS_DV exposes one nested service request document.</desc>
  <rect width="900" height="360" rx="22" fill="#f7f8fa"/><style>.h{font:700 27px Arial;fill:#18243b}.s{font:15px Arial;fill:#41506a}.b{font:700 17px Arial;fill:#1f2937}.c{font:14px Arial;fill:#43516a}</style>
  <text x="34" y="46" class="h">One Service Request, Two Useful Access Shapes</text><text x="34" y="72" class="s">JSON Relational Duality gives the application a document without copying the governed rows.</text>
  <g transform="translate(44 116)"><rect width="210" height="132" rx="15" fill="#fff" stroke="#457b9d" stroke-width="2"/><text x="105" y="34" text-anchor="middle" class="b">Relational Source</text><text x="105" y="65" text-anchor="middle" class="c">ORDERS</text><text x="105" y="87" text-anchor="middle" class="c">ORDER_ITEMS</text><text x="105" y="109" text-anchor="middle" class="c">Keys + constraints</text></g>
  <path d="M264 182h66" stroke="#7d8799" stroke-width="4"/><path d="m330 182-13-9v18z" fill="#7d8799"/>
  <g transform="translate(340 116)"><rect width="220" height="132" rx="15" fill="#fff" stroke="#d56b42" stroke-width="2"/><text x="110" y="34" text-anchor="middle" class="b">ORDERS_DV</text><text x="110" y="65" text-anchor="middle" class="c">Header + nested items</text><text x="110" y="87" text-anchor="middle" class="c">No synchronization job</text><text x="110" y="109" text-anchor="middle" class="c">Same governed source</text></g>
  <path d="M570 182h66" stroke="#7d8799" stroke-width="4"/><path d="m636 182-13-9v18z" fill="#7d8799"/>
  <g transform="translate(646 116)"><rect width="210" height="132" rx="15" fill="#e9f6ee" stroke="#17603a" stroke-width="2"/><text x="105" y="34" text-anchor="middle" class="b">Two Consumers</text><text x="105" y="65" text-anchor="middle" class="c">Application: JSON</text><text x="105" y="87" text-anchor="middle" class="c">Analyst: SQL columns</text><text x="105" y="109" text-anchor="middle" class="c">Maria: one request</text></g>
  <rect x="170" y="286" width="560" height="48" rx="12" fill="#eef1ff"/><text x="450" y="316" text-anchor="middle" class="b">Projection changes the shape, not the source of truth</text>
</svg>
