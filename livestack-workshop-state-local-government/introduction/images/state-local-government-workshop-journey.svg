<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Colorado resident-services workshop journey</title>
  <desc id="desc">Seven stages connect a shared foundation to operational measures, request documents, semantic search, partner relationships, service access, and predictive planning.</desc>
  <rect width="1280" height="420" rx="24" fill="#f7f8fa"/>
  <style>
    .t{font:700 30px Arial,sans-serif;fill:#18243b}.s{font:17px Arial,sans-serif;fill:#40506a}
    .n{font:700 15px Arial,sans-serif;fill:#fff}.h{font:700 16px Arial,sans-serif;fill:#1e293b}.b{font:14px Arial,sans-serif;fill:#4b5568}
  </style>
  <text x="42" y="52" class="t">From Early Warning to Accountable Service Planning</text>
  <text x="42" y="82" class="s">Jessica and Maria follow one governed evidence path across seven active technical labs.</text>
  <path d="M105 194H1175" stroke="#b9c3d3" stroke-width="5"/>
  <g transform="translate(45 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#17603a"/><text x="78" y="40" text-anchor="middle" class="n">1</text><text x="78" y="78" text-anchor="middle" class="h">Foundation</text><text x="78" y="105" text-anchor="middle" class="b">Map connected</text><text x="78" y="125" text-anchor="middle" class="b">evidence</text></g>
  <g transform="translate(218 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#b35c1e"/><text x="78" y="40" text-anchor="middle" class="n">2</text><text x="78" y="78" text-anchor="middle" class="h">Command Center</text><text x="78" y="105" text-anchor="middle" class="b">Trace KPIs to</text><text x="78" y="125" text-anchor="middle" class="b">request rows</text></g>
  <g transform="translate(391 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#d56b42"/><text x="78" y="40" text-anchor="middle" class="n">3</text><text x="78" y="78" text-anchor="middle" class="h">Request JSON</text><text x="78" y="105" text-anchor="middle" class="b">Inspect one</text><text x="78" y="125" text-anchor="middle" class="b">governed request</text></g>
  <g transform="translate(564 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#8f55d9"/><text x="78" y="40" text-anchor="middle" class="n">4</text><text x="78" y="78" text-anchor="middle" class="h">Demand Meaning</text><text x="78" y="105" text-anchor="middle" class="b">Search services</text><text x="78" y="125" text-anchor="middle" class="b">and signals</text></g>
  <g transform="translate(737 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#2a9d8f"/><text x="78" y="40" text-anchor="middle" class="n">5</text><text x="78" y="78" text-anchor="middle" class="h">Partner Paths</text><text x="78" y="105" text-anchor="middle" class="b">Follow community</text><text x="78" y="125" text-anchor="middle" class="b">handoffs</text></g>
  <g transform="translate(910 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#457b9d"/><text x="78" y="40" text-anchor="middle" class="n">6</text><text x="78" y="78" text-anchor="middle" class="h">Service Access</text><text x="78" y="105" text-anchor="middle" class="b">Measure distance</text><text x="78" y="125" text-anchor="middle" class="b">and capacity</text></g>
  <g transform="translate(1083 125)"><rect width="155" height="160" rx="16" fill="#fff" stroke="#d3d9e2" stroke-width="2"/><circle cx="78" cy="34" r="22" fill="#c5922f"/><text x="78" y="40" text-anchor="middle" class="n">7</text><text x="78" y="78" text-anchor="middle" class="h">Prediction</text><text x="78" y="105" text-anchor="middle" class="b">Prioritize future</text><text x="78" y="125" text-anchor="middle" class="b">service pressure</text></g>
  <rect x="205" y="326" width="870" height="58" rx="14" fill="#e9f6ee"/>
  <text x="640" y="361" text-anchor="middle" class="h" fill="#17603a">One governed chain of evidence: statewide warning → regional action → predictive planning</text>
