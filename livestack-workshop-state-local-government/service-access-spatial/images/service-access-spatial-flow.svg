<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Service access spatial analysis flow</title><desc id="d">Resident and service-center points feed a distance calculation, then combine with capacity for a regional planning decision.</desc>
  <rect width="900" height="360" rx="22" fill="#f7f8fa"/><style>.h{font:700 27px Arial;fill:#18243b}.s{font:15px Arial;fill:#41506a}.b{font:700 16px Arial;fill:#1f2937}.c{font:14px Arial;fill:#43516a}</style>
  <text x="34" y="46" class="h">Measure Service Access, Then Check Capacity</text><text x="34" y="72" class="s">Oracle Spatial keeps location calculations connected to governed operational rows.</text>
  <g transform="translate(30 118)"><rect width="180" height="128" rx="15" fill="#fff" stroke="#d56b42" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="b">Resident Point</text><text x="90" y="69" text-anchor="middle" class="c">Elena Garcia</text><text x="90" y="91" text-anchor="middle" class="c">CUSTOMERS.LOCATION</text></g>
  <path d="M218 182h24" stroke="#7d8799" stroke-width="4"/><path d="m242 182-13-9v18z" fill="#7d8799"/>
  <g transform="translate(250 118)"><rect width="180" height="128" rx="15" fill="#fff" stroke="#457b9d" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="b">Center Points</text><text x="90" y="69" text-anchor="middle" class="c">Grand Junction</text><text x="90" y="91" text-anchor="middle" class="c">FULFILLMENT_CENTERS</text></g>
  <path d="M438 182h24" stroke="#7d8799" stroke-width="4"/><path d="m462 182-13-9v18z" fill="#7d8799"/>
  <g transform="translate(470 118)"><rect width="180" height="128" rx="15" fill="#fff" stroke="#8f55d9" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="b">Spatial SQL</text><text x="90" y="69" text-anchor="middle" class="c">SDO_GEOM.</text><text x="90" y="91" text-anchor="middle" class="c">SDO_DISTANCE</text></g>
  <path d="M658 182h24" stroke="#7d8799" stroke-width="4"/><path d="m682 182-13-9v18z" fill="#7d8799"/>
  <g transform="translate(690 118)"><rect width="180" height="128" rx="15" fill="#e9f6ee" stroke="#17603a" stroke-width="2"/><text x="90" y="40" text-anchor="middle" class="b">Decision</text><text x="90" y="77" text-anchor="middle" class="c">Nearest Capacity</text></g>
  <rect x="170" y="286" width="560" height="48" rx="12" fill="#eef3f8"/><text x="450" y="316" text-anchor="middle" class="b">Distance + SLED_SERVICE_CAPACITY_V → regional planning</text>
</svg>
