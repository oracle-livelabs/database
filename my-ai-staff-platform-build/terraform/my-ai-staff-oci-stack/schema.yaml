title: My AI Staff on OCI
description: Creates the My AI Staff workshop infrastructure and bootstraps the database and host runtime.
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
groupings:
  - title: Placement and access
    variables:
      - compartment_ocid
      - tenancy_ocid
      - region
      - availability_domain
      - ssh_public_key
      - admin_cidr
  - title: Sensitive database values
    variables:
      - adb_admin_password
      - wallet_password
      - ai_for_you_password
  - title: Advanced artifact settings
    variables:
      - adb_db_version
      - platform_zip_url
      - model_url
      - model_sha256
      - resource_prefix
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Compartment
    required: true
  tenancy_ocid:
    type: string
    title: Tenancy OCID
    required: true
  region:
    type: string
    title: Region
    required: true
  availability_domain:
    type: string
    title: Availability domain override
    required: false
  ssh_public_key:
    type: string
    title: SSH public key
    required: true
  admin_cidr:
    type: string
    title: Administrator SSH CIDR
    required: true
  adb_admin_password:
    type: password
    title: Autonomous Database ADMIN password
    required: true
  wallet_password:
    type: password
    title: Wallet password
    required: true
  ai_for_you_password:
    type: password
    title: AI_FOR_YOU password
    required: true
  adb_db_version:
    type: string
    title: Autonomous Database version
    required: false
  platform_zip_url:
    type: string
    title: Platform ZIP URL
    required: false
  model_url:
    type: string
    title: ONNX model URL
    required: false
  model_sha256:
    type: string
    title: ONNX model SHA-256
    required: false
  resource_prefix:
    type: string
    title: Resource prefix
    required: false
